media:
  input: public/media
  output: /media
  rename: safe
  categories: [image, video]

components:
  socialMedia:
    type: object
    fields:
      - name: facebook
        label: Facebook
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: youtube
        label: YouTube
        type: string

  positionedImage:
    type: object
    fields:
      - name: image
        label: Image
        type: image

      - name: offsetX
        label: Horizontal focus (%) (left = 0, right = 100)
        type: number
        options:
          min: 0
          max: 100

      - name: offsetY
        label: Vertical focus (%) (higher = lower)
        type: number
        options:
          min: 0
          max: 100

      - name: alt
        label: Alt text
        type: string

  galleryPhoto:
    type: object
    fields:
      - name: image
        label: Image
        type: image

      - name: offsetX
        label: Horizontal focus (%) (left = 0, right = 100)
        type: number
        options:
          min: 0
          max: 100

      - name: offsetY
        label: Vertical focus (%) (higher = lower)
        type: number
        options:
          min: 0
          max: 100

      - name: alt
        label: Alt text
        type: string

  galleryVideo:
    type: object
    fields:
      - name: video
        label: Video file
        type: file
        options:
          categories: [video]

      - name: poster
        label: Poster image
        type: image

      - name: alt
        label: Alt text
        type: string

content:
  # HOME
  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: heroLogo
        label: Hero logo
        description: Logo shown on the left (desktop) or above (mobile) in the hero.
        type: image

      - name: heroSubtitleLead
        label: Hero subtitle (lead)
        description: First line shown below the logo (fades in first).
        type: text

      - name: heroSubtitleFollow
        label: Hero subtitle (follow)
        description: Second line shown below the lead (fades in after a delay).
        type: text

      - name: navAbout
        label: Nav — About
        description: Header link label for the about section.
        type: string

      - name: navOffer
        label: Nav — Offer
        description: Header link label for the offer section.
        type: string

      - name: navWhoIAm
        label: Nav — Who I am
        description: Header link label for the who I am section.
        type: string

      - name: navPortfolio
        label: Nav — Portfolio
        description: Header link label for the portfolio section.
        type: string

      - name: navContact
        label: Nav — Contact
        description: Header link label for the contact section.
        type: string

      - name: portfolioEyebrow
        label: Portfolio eyebrow
        description: Small uppercase label above the portfolio section title.
        type: string

      - name: portfolioTitle
        label: Portfolio title
        description: Main heading for the portfolio section.
        type: text

      - name: portfolioVisitLabel
        label: Portfolio visit link
        description: Link text for each project's live site.
        type: string

  # ABOUT
  - name: about
    label: About
    type: file
    path: content/about.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: Eyebrow
        description: Small uppercase label above the section.
        type: string

      - name: ingress
        label: Ingress
        description: Lead line shown below the eyebrow.
        type: text

      - name: paragraphs
        label: Intro paragraphs
        type: text
        list: true

      - name: whoWeAreTitle
        label: Differentiators — title
        type: string

      - name: whoWeAreItems
        label: Differentiators — bullets
        type: string
        list: true

  # OFFER
  - name: offer
    label: Offer
    type: file
    path: content/offer.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string

      - name: ingress
        label: Ingress
        type: text

      - name: summary
        label: Summary
        type: text

      - name: pricing
        label: Pricing
        description: Prominent price line shown below the summary (e.g. starting price and payment model).
        type: text

      - name: featuresTitle
        label: Features — title
        type: string

      - name: features
        label: Features
        type: string
        list: true

      - name: footnote
        label: Footnote
        description: Closing note encouraging contact for custom needs.
        type: text

  # WHO I AM
  - name: who-i-am
    label: Who I am
    type: file
    path: content/who-i-am.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string

      - name: ingress
        label: Ingress
        type: text

      - name: techTitle
        label: Tech side — title
        type: string

      - name: techImage
        label: Tech side — image
        type: image

      - name: techImageAlt
        label: Tech side — image alt text
        type: string

      - name: techDescription
        label: Tech side — description
        type: text

      - name: cvUrl
        label: CV URL
        type: string

      - name: cvLabel
        label: CV link label
        type: string

      - name: artistTitle
        label: Artist side — title
        type: string

      - name: artistImage
        label: Artist side — image
        type: image

      - name: artistImageAlt
        label: Artist side — image alt text
        type: string

      - name: artistDescription
        label: Artist side — description
        type: text

      - name: closing
        label: Closing line
        type: text

  # PORTFOLIO
  - name: portfolio
    label: Portfolio
    type: collection
    path: content/portfolio
    format: json
    filename: "{title}.json"
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: description
        label: Description
        type: text

      - name: siteUrl
        label: Live site URL
        description: Link to the published artist website.
        type: string

      - name: coverImage
        label: Cover image
        component: positionedImage

      - name: gallery
        label: Gallery
        description: Photos and videos from the media library.
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{type}"
        blocks:
          - name: photo
            label: Photo
            component: galleryPhoto

          - name: video
            label: Video
            component: galleryVideo

      - name: youtubeLink
        label: YouTube link
        description: Optional embedded video URL (e.g. for showreels).
        type: string

  # BLOG
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: json
    filename: "{title}.json"
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: excerpt
        label: Excerpt
        type: text

      - name: coverImage
        label: Cover image
        type: image

      - name: body
        label: Body
        type: rich-text

  # TESTIMONIALS
  - name: testimonials
    label: Testimonials
    type: file
    path: content/testimonials.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: Testimonials
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author}"
        fields:
          - name: quote
            label: Quote
            type: text

          - name: author
            label: Author
            type: string

          - name: role
            label: Role / publication
            type: string

  # CONTACT
  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    operations:
      delete: false
    fields:
      - name: eyebrow
        label: Eyebrow
        description: Small uppercase label above the section.
        type: string

      - name: title
        label: Title
        type: string

      - name: description
        label: Description
        type: text

      - name: email
        label: Email
        type: string

      - name: emailLabel
        label: Email link label
        description: Text shown for the mailto link (often the same as the email).
        type: string

actions:
  - name: deploy-site
    label: Deploy Site
    workflow: pages-cms-action.yml
