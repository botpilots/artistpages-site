media:
  input: public/media
  output: /media
  rename: safe
  categories: [image, video]

components:
  socialMedia:
    type: object
    fields:
      - name: facebook
        label: Facebook
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: youtube
        label: YouTube
        type: string

  positionedImage:
    type: object
    fields:
      - name: image
        label: Image
        type: image

      - name: offsetX
        label: Horizontal focus (%) (left = 0, right = 100)
        type: number
        options:
          min: 0
          max: 100

      - name: offsetY
        label: Vertical focus (%) (higher = lower)
        type: number
        options:
          min: 0
          max: 100

      - name: alt
        label: Alt text
        type: string

  galleryPhoto:
    type: object
    fields:
      - name: image
        label: Image
        type: image

      - name: offsetX
        label: Horizontal focus (%) (left = 0, right = 100)
        type: number
        options:
          min: 0
          max: 100

      - name: offsetY
        label: Vertical focus (%) (higher = lower)
        type: number
        options:
          min: 0
          max: 100

      - name: alt
        label: Alt text
        type: string

  galleryVideo:
    type: object
    fields:
      - name: video
        label: Video file
        type: file
        options:
          categories: [video]

      - name: poster
        label: Poster image
        type: image

      - name: alt
        label: Alt text
        type: string

content:
  # HOME
  - name: home
    label: Home
    type: file
    path: content/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: heroTitle
        label: Hero title
        description: Main name on the landing image (default top left). Offsets (%) position the center of the text in the hero.
        type: object
        fields:
          - name: text
            label: Text
            type: string

          - name: offsetX
            label: Horizontal position — desktop (%)
            description: Text center on viewports 768px and wider (0 = left, 100 = right).
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical position — desktop (%)
            description: Text center on viewports 768px and wider (0 = top, 100 = bottom).
            type: number
            options:
              min: 0
              max: 100

          - name: offsetXMobile
            label: Horizontal position — mobile (%)
            description: Text center below 768px width only. Leave empty to use the desktop value.
            type: number
            options:
              min: 0
              max: 100

          - name: offsetYMobile
            label: Vertical position — mobile (%)
            description: Text center below 768px width only. Leave empty to use the desktop value.
            type: number
            options:
              min: 0
              max: 100

      - name: heroSubtitle
        label: Hero subtitle
        description: Subtitle on the landing image (default top right). Offsets (%) position the center of the text in the hero.
        type: object
        fields:
          - name: text
            label: Text
            type: string

          - name: offsetX
            label: Horizontal position — desktop (%)
            description: Text center on viewports 768px and wider (0 = left, 100 = right).
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical position — desktop (%)
            description: Text center on viewports 768px and wider (0 = top, 100 = bottom).
            type: number
            options:
              min: 0
              max: 100

          - name: offsetXMobile
            label: Horizontal position — mobile (%)
            description: Text center below 768px width only. Leave empty to use the desktop value.
            type: number
            options:
              min: 0
              max: 100

          - name: offsetYMobile
            label: Vertical position — mobile (%)
            description: Text center below 768px width only. Leave empty to use the desktop value.
            type: number
            options:
              min: 0
              max: 100

      - name: heroImage
        label: Front page image
        description: Full-screen landing photo behind the hero title and subtitle.
        type: object
        fields:
          - name: image
            label: Image
            type: image

          - name: offsetX
            label: Horizontal focus (%) (left = 0, right = 100)
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical focus (%) (higher = lower)
            type: number
            options:
              min: 0
              max: 100

      - name: siteIcon
        label: Site icon (favicon)
        description: Circular icon for browser tabs and bookmarks. Uses the same focus and zoom controls as photos.
        type: object
        fields:
          - name: image
            label: Image
            type: image

          - name: offsetX
            label: Horizontal focus (%) (left = 0, right = 100)
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical focus (%) (higher = lower)
            type: number
            options:
              min: 0
              max: 100

          - name: zoom
            label: Zoom (%) (100 = default crop, higher = zoom in)
            type: number
            options:
              min: 100
              max: 300

      - name: biography
        label: Biography (English)
        type: rich-text

      - name: aboutMosaic
        label: About mosaic
        description: Three images in order.
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            collapsed: true
            summary: "Image {index}"
        fields:
          - name: image
            label: Image
            type: image

          - name: offsetX
            label: Horizontal focus (%) (left = 0, right = 100)
            type: number
            options:
              min: 0
              max: 100

          - name: offsetY
            label: Vertical focus (%) (higher = lower)
            type: number
            options:
              min: 0
              max: 100

          - name: alt
            label: Alt text
            type: string

  # ABOUT
  - name: about
    label: About
    type: file
    path: content/about.json
    format: json
    operations:
      delete: false
    fields:
      - name: title
        label: Page title
        type: string

      - name: body
        label: Body
        type: rich-text

      - name: images
        label: Images
        type: object
        component: positionedImage
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"

  # PORTFOLIO
  - name: portfolio
    label: Portfolio
    type: collection
    path: content/portfolio
    format: json
    filename: "{title}.json"
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: description
        label: Description
        type: text

      - name: coverImage
        label: Cover image
        component: positionedImage

      - name: gallery
        label: Gallery
        description: Photos and videos from the media library.
        type: block
        blockKey: type
        list:
          collapsible:
            collapsed: true
            summary: "{type}"
        blocks:
          - name: photo
            label: Photo
            component: galleryPhoto

          - name: video
            label: Video
            component: galleryVideo

      - name: youtubeLink
        label: YouTube link
        description: Optional embedded video URL (e.g. for showreels).
        type: string

  # BLOG
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: json
    filename: "{title}.json"
    view:
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string

      - name: date
        label: Date
        type: date

      - name: excerpt
        label: Excerpt
        type: text

      - name: coverImage
        label: Cover image
        type: image

      - name: body
        label: Body
        type: rich-text

  # TESTIMONIALS
  - name: testimonials
    label: Testimonials
    type: file
    path: content/testimonials.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: Testimonials
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{author}"
        fields:
          - name: quote
            label: Quote
            type: text

          - name: author
            label: Author
            type: string

          - name: role
            label: Role / publication
            type: string

  # CONTACT
  - name: contact
    label: Contact
    type: file
    path: content/contact.json
    format: json
    operations:
      delete: false
    fields:
      - name: agency
        label: Agency
        type: object
        fields:
          - name: name
            label: Name
            type: string

          - name: email
            label: Email
            type: string

          - name: phone
            label: Phone
            type: string

      - name: artistPages
        label: Artist Pages
        type: object
        fields:
          - name: name
            label: Name
            type: string

          - name: email
            label: Email
            type: string

          - name: phone
            label: Phone
            type: string

          - name: location
            label: Location
            type: string

      - name: socialMedia
        label: Social Media
        component: socialMedia

actions:
  - name: deploy-site
    label: Deploy Site
    workflow: pages-cms-action.yml
